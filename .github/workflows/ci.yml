name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.build-group }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            build-group: linux-x64
          - os: ubuntu-22.04-arm
            arch: arm64
            build-group: linux-arm64
          - os: macos-latest
            arch: x64
            build-group: darwin-universal
          - os: windows-2022
            arch: x86
            build-group: win32-x86
          - os: windows-2022
            arch: x64
            build-group: win32-x64
          - os: windows-11-arm
            arch: arm64
            build-group: win32-arm64
    env:
      BUILD_GROUP: ${{ matrix.build-group }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
      with:
        node-version: '20'
        architecture: ${{ matrix.arch }}
    - name: Install linux dependencies
      if: ${{ (matrix.build-group == 'linux-x64') || (matrix.build-group == 'linux-arm64') }}
      run: sudo apt-get install libxtst-dev libpng++-dev
    - run: npm ci
    - name: Prebuildify
      run: npm run prebuild-$BUILD_GROUP
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: prebuilds-${{ matrix.build-group }}
        path: prebuilds/
        if-no-files-found: error
  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: prebuilds-*
        path: prebuilds
        merge-multiple: true
    - uses: phips28/gh-action-bump-version@63bc5b97aade4390bf3f33416b8adb891a0f28d7
      with:
        tag-prefix: 'v'
        version-type: 'patch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
    - run: npm publish --provenance --access public
